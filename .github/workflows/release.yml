name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (defaults to git ref name)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
          cache: true

      - name: Determine release version
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ -z "$tag" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          ver="${tag#v}"
          printf '%s\n' "$ver" > VERSION
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify Go code
        run: go vet ./...

      - name: Build server and multi-platform agent binaries
        run: ./scripts/build.sh

      - name: Stage release artifacts and SHA256SUMS
        run: |
          mkdir -p dist
          cp bin/fleet-server dist/fleet-server
          cp bin/fleet-server dist/fleet-server-linux-amd64
          ldflags="$(./scripts/build.sh --ldflags)"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath -ldflags "$ldflags" \
            -o dist/fleet-server-linux-arm64 ./cmd/fleet-server
          cp bin/agents/fleet-agent-* dist/
          cp deploy/install-server.sh dist/install-server.sh
          cp deploy/upgrade-server.sh dist/upgrade-server.sh
          cp deploy/uninstall-server.sh dist/uninstall-server.sh
          chmod 0755 dist/fleet-server* dist/fleet-agent-* dist/*.sh
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
