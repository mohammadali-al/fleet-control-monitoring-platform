# Reference Grafana configuration for the Fleet panel (T-0064).
# Rendered/installed to /etc/fleet-grafana/grafana.ini by deploy/install-server.sh.
#
# Grafana binds strictly to loopback (127.0.0.1:3000) and trusts the Remote-User
# header forwarded by Caddy after Authelia 2FA verification.

[paths]
data = /var/lib/fleet-grafana
logs = /var/lib/fleet-grafana/logs
plugins = /var/lib/fleet-grafana/plugins
provisioning = /etc/fleet-grafana/provisioning

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = fleet.internal
root_url = https://fleet.internal/grafana/
serve_from_sub_path = true

[database]
type = sqlite3
path = grafana.db

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
# Allow embedding Grafana dashboards inside the Fleet panel Monitor page iframe.
allow_embedding = true
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true

[snapshots]
external_enabled = false

[dashboards]
default_home_dashboard_path = /etc/fleet-grafana/dashboards/fleet-overview.json

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false
default_theme = dark

[auth]
disable_login_form = true
disable_signout_menu = true

[auth.proxy]
enabled = true
header_name = Remote-User
header_property = username
auto_sign_up = true
sync_ttl = 60
whitelist = 127.0.0.1, ::1
headers = Email:Remote-Email Name:Remote-Name Groups:Remote-Groups
enable_login_token = false

[log]
mode = console
level = info
