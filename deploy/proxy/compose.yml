# Auth proxy for the Fleet panel (T-0024): Caddy (HTTPS) + Authelia (local users, TOTP).
#
# Run from this directory after preparing ./state (see deploy/README.md):
#   docker compose up -d
#
# state/ layout (all operator-provided, git-ignored):
#   state/certs/tls.crt, tls.key        TLS certificate for fleet.internal + auth.fleet.internal
#   state/secrets/{jwt,session,storage} one random string per file
#   state/authelia/users.yml            local users (from ../authelia/users.yml.example)
#   state/authelia/                     also receives db.sqlite3 and notification.txt
#
# Caddy uses the host network so it can reach fleet-server on 127.0.0.1:6789, which is
# deliberately NOT exposed beyond loopback. Authelia is published on loopback only.

name: fleet-proxy

services:
  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ../authelia/configuration.yml:/config/configuration.yml:ro
      - ./state/authelia:/data
      - ./state/secrets:/secrets:ro
    environment:
      TZ: "${TZ:-UTC}"
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    depends_on:
      - authelia
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/certs:/certs:ro
      - ./state/caddy:/data
