# Auth proxy for the Fleet panel (T-0024 / T-0036): Caddy (HTTPS) + Authelia (local users, TOTP).
#
# Installed to /opt/fleet/proxy/compose.yml and managed by fleet-proxy.service.
# Mutable state lives in /var/lib/fleet-proxy/ (overridable via FLEET_PROXY_STATE_DIR):
#   certs/tls.crt, tls.key              TLS certificate for panel + auth domains
#   secrets/{jwt,session,storage}       auto-generated random secrets (mode 0600)
#   authelia/users.yml                  local users + argon2id password hashes
#   authelia/{db.sqlite3,notification.txt}
#   caddy/                              Caddy runtime/ACME state
#
# Caddy uses host networking so it can reach fleet-server on 127.0.0.1:6789 (which stays
# bound to loopback). Authelia is published on loopback only.

name: fleet-proxy

services:
  authelia:
    image: authelia/authelia:4.39.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLEET_AUTH_PORT:-9091}:9091"
    volumes:
      - ${FLEET_AUTHELIA_CONFIG:-./authelia/configuration.yml}:/config/configuration.yml:ro
      - ${FLEET_PROXY_STATE_DIR:-/var/lib/fleet-proxy}/authelia:/data
      - ${FLEET_PROXY_STATE_DIR:-/var/lib/fleet-proxy}/secrets:/secrets:ro
    environment:
      TZ: "${TZ:-UTC}"
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage

  caddy:
    image: caddy:2.10.0
    restart: unless-stopped
    network_mode: host
    depends_on:
      - authelia
    volumes:
      - ${FLEET_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${FLEET_PROXY_STATE_DIR:-/var/lib/fleet-proxy}/certs:/certs:ro
      - ${FLEET_PROXY_STATE_DIR:-/var/lib/fleet-proxy}/caddy:/data
