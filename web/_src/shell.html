<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Fleet panel</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="assets/js/app.js"></script>
</head>
<body>
<!-- tmpl:shell-open — becomes the layout template in Go html/template (sprite + sidebar + topbar) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-fleet" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3 6h10M17 6h4M3 12h4M11 12h10M3 18h12M19 18h2"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
    <symbol id="i-evidence" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 14l2 2 4-4"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13"/><path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
  </defs>
</svg>

<a class="skip-link" href="#main">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <a class="brand" href="machines.html">
      <span class="brand__mark"><svg class="icon" aria-hidden="true"><use href="#i-fleet"/></svg></span>
      <span>Fleet panel<small>Control &amp; monitoring</small></span>
    </a>
    <nav class="nav" aria-label="Pages">
      <div class="nav__group">
        <div class="nav__label">Operate</div>
        <a class="nav__link" href="machines.html"{{aria:machines}}><svg class="icon" aria-hidden="true"><use href="#i-server"/></svg>Machines</a>
        <a class="nav__link" href="projects.html"{{aria:projects}}><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>Projects &amp; tests</a>
        <a class="nav__link" href="commands.html"{{aria:commands}}><svg class="icon" aria-hidden="true"><use href="#i-bolt"/></svg>Command runner</a>
        <a class="nav__link" href="terminal.html"{{aria:terminal}}><svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>Terminal</a>
      </div>
      <div class="nav__group">
        <div class="nav__label">Plan</div>
        <a class="nav__link" href="baseline.html"{{aria:baseline}}><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>Baseline items</a>
        <a class="nav__link" href="maneuver.html"{{aria:maneuver}}><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>Maneuver<span class="chip chip--outline nav__tag">Stub</span></a>
      </div>
      <div class="nav__group">
        <div class="nav__label">Observe</div>
        <a class="nav__link" href="monitor.html"{{aria:monitor}}><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg>Monitor data</a>
        <a class="nav__link" href="watchdog.html"{{aria:watchdog}}><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>Watchdog</a>
        <a class="nav__link" href="evidence.html"{{aria:evidence}}><svg class="icon" aria-hidden="true"><use href="#i-evidence"/></svg>Evidence</a>
      </div>
      <div class="nav__group">
        <div class="nav__label">Administer</div>
        <a class="nav__link" href="backup.html"{{aria:backup}}><svg class="icon" aria-hidden="true"><use href="#i-database"/></svg>Backup</a>
      </div>
    </nav>
    <div class="sidebar__foot">
      <dl>
        <dt>Main server</dt><dd>fleet-server</dd>
        <dt>Panel</dt><dd class="mono">:6789</dd>
        <dt>Auth</dt><dd>via auth proxy</dd>
      </dl>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__menu" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <span class="chip chip--outline" title="Only one test can be active system-wide"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>Active test: none</span>
      <span class="topbar__spacer"></span>
      <span class="chip chip--info" title="This page is a static front-end preview"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>Mock data</span>
      <button class="icon-btn icon-btn--bordered theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
    </header>
<!-- /tmpl:shell-open -->

    <main class="content" id="main">
{{content}}
    </main>
  </div>
</div>
<div class="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
